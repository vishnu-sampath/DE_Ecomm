version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-ecomm
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d/
    networks:
      - de_network

volumes:
  mysql_data:

networks:
  de_network:
    driver: bridge
